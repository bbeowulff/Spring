spring.application.name=Spring_12_15

# ? Enable H2 console (useful for debugging in browser: /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ? Use an in-memory H2 database named "demo"
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ? Let Spring Boot run schema.sql automatically on startup
spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:schema.sql

# Optional: show SQL in logs
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
logging.level.org.springframework.jdbc.core=DEBUG
