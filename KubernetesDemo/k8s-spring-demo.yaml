apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-k8s-demo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-k8s-demo
  template:
    metadata:
      labels:
        app: spring-k8s-demo
    spec:
      containers:
        - name: spring-k8s-demo
          image: spring-k8s-demo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spring-k8s-demo-service
spec:
  type: NodePort
  selector:
    app: spring-k8s-demo
  ports:
    - port: 8080        # portul Service
      targetPort: 8080  # portul în container
      nodePort: 30080   # portul expus de nod
